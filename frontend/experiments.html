<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Experiments</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <h1>Experiment History</h1>

  <div class="filter-bar">
    <input type="date" id="date-from" />
    <input type="date" id="date-to" />
    <select id="system-filter">
      <option value="All">All</option>
      <option value="baseline">Baseline</option>
      <option value="multi_agent">Multi-agent</option>
    </select>
    <select id="conflict-filter">
      <option value="All">All</option>
      <option value="numeric">Numeric</option>
      <option value="temporal">Temporal</option>
      <option value="opinion">Opinion</option>
      <option value="other">Other</option>
      <option value="none">None</option>
    </select>
  </div>

  <table id="experiments-table">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Query</th>
        <th>System</th>
        <th>Strategy</th>
        <th>Conflict</th>
        <th>Faithful</th>
        <th>Runtime (ms)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/experiments.js"></script>
  <script type="module">
    import { initExperiments } from "./js/experiments.js";
    document.addEventListener("DOMContentLoaded", initExperiments);
  </script>
</body>
</html>
